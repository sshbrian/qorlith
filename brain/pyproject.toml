[project]
name = "qorlith-brain"
version = "0.1.0"
description = "LangGraph control room for Qorlith — health, plan, stills, board, video."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.55",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qorlith-brain = "brain.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
